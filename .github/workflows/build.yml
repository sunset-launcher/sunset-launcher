name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_name: mc-launcher
            artifact_name: sunset-launcher-linux-x64
            deb_arch: amd64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: mc-launcher
            artifact_name: sunset-launcher-linux-arm64
            deb_arch: arm64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: mc-launcher.exe
            artifact_name: sunset-launcher-windows-x64.exe
            deb_arch: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: mc-launcher
            artifact_name: sunset-launcher-macos-arm64
            deb_arch: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: mc-launcher
            artifact_name: sunset-launcher-macos-x64
            deb_arch: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev dpkg-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run unit tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare standalone artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact_name }}"

      - name: Sign Windows binary (if certificate secrets configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          ARTIFACT: dist/${{ matrix.artifact_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret configured; skipping Authenticode signing."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
          try {
            signtool.exe sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:ARTIFACT
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
          }

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}" -DestinationPath "dist/sunset-launcher-windows-x64-portable.zip" -Force

      - name: Package Linux .deb installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          PKG_DIR="deb_root"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"
          cp "dist/${{ matrix.artifact_name }}" "$PKG_DIR/usr/bin/sunset-launcher"
          chmod 0755 "$PKG_DIR/usr/bin/sunset-launcher"
          cp logo.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/sunset-launcher.png"
          cat > "$PKG_DIR/usr/share/applications/sunset-launcher.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Sunset Launcher
          Comment=Fast, native Minecraft launcher in Rust
          Exec=sunset-launcher
          Icon=sunset-launcher
          Terminal=false
          Categories=Game;
          EOF
          sed -i 's/^          //' "$PKG_DIR/usr/share/applications/sunset-launcher.desktop"
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: sunset-launcher
          Version: ${VER}
          Section: games
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libc6, libgtk-3-0, libxkbcommon0
          Maintainer: svarka <noreply@sunset-launcher>
          Description: Native Minecraft launcher with Vanilla, Fabric, Quilt, Forge, NeoForge, and Modrinth support
          EOF
          sed -i 's/^          //' "$PKG_DIR/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist/sunset-launcher_${VER}_${{ matrix.deb_arch }}.deb"

      - name: Package macOS .app bundle ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          APP_DIR="Sunset Launcher.app/Contents"
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources"
          cp "dist/${{ matrix.artifact_name }}" "$APP_DIR/MacOS/sunset-launcher"
          chmod +x "$APP_DIR/MacOS/sunset-launcher"
          cp logo.png "$APP_DIR/Resources/logo.png"
          cat > "$APP_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sunset Launcher</string>
            <key>CFBundleDisplayName</key><string>Sunset Launcher</string>
            <key>CFBundleIdentifier</key><string>io.github.sunset-launcher</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>sunset-launcher</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict>
          </plist>
          EOF
          ditto -c -k --sequesterRsrc --keepParent "Sunset Launcher.app" "dist/${{ matrix.artifact_name }}.app.zip"

      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd dist
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sha256) continue ;; esac
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
