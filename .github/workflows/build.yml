name: Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bin_name: mc-launcher
            artifact_name: sunset-launcher-linux-x64
            deb_arch: amd64
            rpm_arch: x86_64
            appimage_arch: x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            bin_name: mc-launcher
            artifact_name: sunset-launcher-linux-arm64
            deb_arch: arm64
            rpm_arch: aarch64
            appimage_arch: aarch64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: mc-launcher.exe
            artifact_name: sunset-launcher-windows-x64.exe
            deb_arch: ""
            rpm_arch: ""
            appimage_arch: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: mc-launcher
            artifact_name: sunset-launcher-macos-arm64
            deb_arch: ""
            rpm_arch: ""
            appimage_arch: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            bin_name: mc-launcher
            artifact_name: sunset-launcher-macos-x64
            deb_arch: ""
            rpm_arch: ""
            appimage_arch: ""

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgtk-3-dev dpkg-dev rpm file

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Setup MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo clippy --all-targets --target ${{ matrix.target }} -- -D warnings

      - name: Run unit tests
        if: matrix.target != 'x86_64-apple-darwin'
        run: cargo test --target ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Prepare release binary
        shell: bash
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "staging/${{ matrix.artifact_name }}"

      - name: Sign Windows binary (if certificate secrets configured)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
          ARTIFACT: staging/${{ matrix.artifact_name }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            Write-Host "No WINDOWS_CERT_PFX_BASE64 secret configured; skipping Authenticode signing."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
          try {
            signtool.exe sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $env:ARTIFACT
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
          }

      - name: Package Windows portable ZIP
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "staging/${{ matrix.artifact_name }}" -DestinationPath "dist/sunset-launcher-windows-x64-portable.zip" -Force

      - name: Package Windows installer (Inno Setup)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          PFX_B64: ${{ secrets.WINDOWS_CERT_PFX_BASE64 }}
          PFX_PASS: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty Source)
          if (-not $iscc -and (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-not $iscc) {
            choco install innosetup -y
            $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          & $iscc "/DMyAppVersion=$ver" packaging\windows\sunset-launcher.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setupExe = "dist\sunset-launcher-windows-x64-setup.exe"
          if (-not [string]::IsNullOrWhiteSpace($env:PFX_B64)) {
            $pfxPath = Join-Path $env:RUNNER_TEMP "codesign-setup.pfx"
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:PFX_B64))
            try {
              signtool.exe sign /f $pfxPath /p $env:PFX_PASS /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 $setupExe
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            } finally {
              Remove-Item -Force -ErrorAction SilentlyContinue $pfxPath
            }
          }

      - name: Package Linux .deb installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          PKG_DIR="deb_root"
          mkdir -p "$PKG_DIR/DEBIAN" "$PKG_DIR/usr/bin" "$PKG_DIR/usr/share/applications" "$PKG_DIR/usr/share/icons/hicolor/256x256/apps"
          cp "staging/${{ matrix.artifact_name }}" "$PKG_DIR/usr/bin/sunset-launcher"
          chmod 0755 "$PKG_DIR/usr/bin/sunset-launcher"
          cp logo.png "$PKG_DIR/usr/share/icons/hicolor/256x256/apps/sunset-launcher.png"
          cat > "$PKG_DIR/usr/share/applications/sunset-launcher.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Sunset Launcher
          Comment=Fast, native Minecraft launcher in Rust
          Exec=sunset-launcher
          Icon=sunset-launcher
          Terminal=false
          Categories=Game;
          StartupWMClass=sunset-launcher
          EOF
          sed -i 's/^          //' "$PKG_DIR/usr/share/applications/sunset-launcher.desktop"
          cat > "$PKG_DIR/DEBIAN/control" <<EOF
          Package: sunset-launcher
          Version: ${VER}
          Section: games
          Priority: optional
          Architecture: ${{ matrix.deb_arch }}
          Depends: libc6, libgtk-3-0, libxkbcommon0
          Maintainer: svarka <noreply@sunset-launcher>
          Description: Native Minecraft launcher with Vanilla, Fabric, Quilt, Forge, NeoForge, and Modrinth support
          EOF
          sed -i 's/^          //' "$PKG_DIR/DEBIAN/control"
          dpkg-deb --build --root-owner-group "$PKG_DIR" "dist/sunset-launcher_${VER}_${{ matrix.deb_arch }}.deb"

      - name: Package Linux .rpm installer
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          RPM_VER="${VER//-/\~}"
          RPM_TOP="$PWD/rpmbuild"
          rm -rf "$RPM_TOP"
          mkdir -p "$RPM_TOP"/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cp "staging/${{ matrix.artifact_name }}" "$RPM_TOP/SOURCES/sunset-launcher"
          cp logo.png "$RPM_TOP/SOURCES/sunset-launcher.png"
          cat > "$RPM_TOP/SOURCES/sunset-launcher.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Sunset Launcher
          Comment=Fast, native Minecraft launcher in Rust
          Exec=sunset-launcher
          Icon=sunset-launcher
          Terminal=false
          Categories=Game;
          StartupWMClass=sunset-launcher
          EOF
          sed -i 's/^          //' "$RPM_TOP/SOURCES/sunset-launcher.desktop"
          cat > "$RPM_TOP/SPECS/sunset-launcher.spec" <<EOF
          %global debug_package %{nil}
          %define _build_id_links none

          Name:           sunset-launcher
          Version:        ${RPM_VER}
          Release:        1
          Summary:        Fast, native Minecraft launcher in Rust
          License:        MIT
          AutoReqProv:    no
          Requires:       gtk3, libxkbcommon

          %description
          Native Minecraft launcher with Vanilla, Fabric, Quilt, Forge, NeoForge, and Modrinth support.

          %install
          mkdir -p %{buildroot}/usr/bin %{buildroot}/usr/share/applications %{buildroot}/usr/share/icons/hicolor/256x256/apps
          install -m 0755 %{_sourcedir}/sunset-launcher %{buildroot}/usr/bin/sunset-launcher
          install -m 0644 %{_sourcedir}/sunset-launcher.png %{buildroot}/usr/share/icons/hicolor/256x256/apps/sunset-launcher.png
          install -m 0644 %{_sourcedir}/sunset-launcher.desktop %{buildroot}/usr/share/applications/sunset-launcher.desktop

          %files
          /usr/bin/sunset-launcher
          /usr/share/applications/sunset-launcher.desktop
          /usr/share/icons/hicolor/256x256/apps/sunset-launcher.png
          EOF
          sed -i 's/^          //' "$RPM_TOP/SPECS/sunset-launcher.spec"
          rpmbuild --define "_topdir $RPM_TOP" --target "${{ matrix.rpm_arch }}" -bb "$RPM_TOP/SPECS/sunset-launcher.spec"
          RPM_OUT=$(find "$RPM_TOP/RPMS" -type f -name '*.rpm' | head -n1)
          cp "$RPM_OUT" "dist/sunset-launcher-${VER}-1.${{ matrix.rpm_arch }}.rpm"

      - name: Package Linux .AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          APP_DIR="AppDir"
          rm -rf "$APP_DIR"
          mkdir -p "$APP_DIR/usr/bin" "$APP_DIR/usr/share/applications" "$APP_DIR/usr/share/icons/hicolor/256x256/apps"
          cp "staging/${{ matrix.artifact_name }}" "$APP_DIR/usr/bin/sunset-launcher"
          chmod 0755 "$APP_DIR/usr/bin/sunset-launcher"
          cp logo.png "$APP_DIR/usr/share/icons/hicolor/256x256/apps/sunset-launcher.png"
          cp logo.png "$APP_DIR/sunset-launcher.png"
          cp logo.png "$APP_DIR/.DirIcon"
          cat > "$APP_DIR/sunset-launcher.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Sunset Launcher
          Comment=Fast, native Minecraft launcher in Rust
          Exec=sunset-launcher
          Icon=sunset-launcher
          Terminal=false
          Categories=Game;
          StartupWMClass=sunset-launcher
          EOF
          sed -i 's/^          //' "$APP_DIR/sunset-launcher.desktop"
          cp "$APP_DIR/sunset-launcher.desktop" "$APP_DIR/usr/share/applications/sunset-launcher.desktop"
          cat > "$APP_DIR/AppRun" <<'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "${0}")")"
          exec "$HERE/usr/bin/sunset-launcher" "$@"
          EOF
          sed -i 's/^          //' "$APP_DIR/AppRun"
          chmod 0755 "$APP_DIR/AppRun"
          curl -fsSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-${{ matrix.appimage_arch }}.AppImage"
          chmod +x appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ARCH="${{ matrix.appimage_arch }}" ./appimagetool --no-appstream "$APP_DIR" "dist/sunset-launcher-${VER}-${{ matrix.appimage_arch }}.AppImage"
          chmod +x "dist/sunset-launcher-${VER}-${{ matrix.appimage_arch }}.AppImage"

      - name: Package macOS .app bundle ZIP
        if: runner.os == 'macOS'
        shell: bash
        run: |
          VER=$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          APP_DIR="Sunset Launcher.app/Contents"
          rm -rf "Sunset Launcher.app" AppIcon.iconset
          mkdir -p "$APP_DIR/MacOS" "$APP_DIR/Resources"
          cp "staging/${{ matrix.artifact_name }}" "$APP_DIR/MacOS/sunset-launcher"
          chmod +x "$APP_DIR/MacOS/sunset-launcher"
          cp logo.png "$APP_DIR/Resources/logo.png"
          ICON_PLIST=""
          mkdir -p AppIcon.iconset
          if sips -z 16 16     logo.png --out AppIcon.iconset/icon_16x16.png >/dev/null 2>&1 && \
             sips -z 32 32     logo.png --out AppIcon.iconset/icon_16x16@2x.png >/dev/null 2>&1 && \
             sips -z 32 32     logo.png --out AppIcon.iconset/icon_32x32.png >/dev/null 2>&1 && \
             sips -z 64 64     logo.png --out AppIcon.iconset/icon_32x32@2x.png >/dev/null 2>&1 && \
             sips -z 128 128   logo.png --out AppIcon.iconset/icon_128x128.png >/dev/null 2>&1 && \
             sips -z 256 256   logo.png --out AppIcon.iconset/icon_128x128@2x.png >/dev/null 2>&1 && \
             sips -z 256 256   logo.png --out AppIcon.iconset/icon_256x256.png >/dev/null 2>&1 && \
             sips -z 512 512   logo.png --out AppIcon.iconset/icon_256x256@2x.png >/dev/null 2>&1 && \
             sips -z 512 512   logo.png --out AppIcon.iconset/icon_512x512.png >/dev/null 2>&1 && \
             sips -z 1024 1024 logo.png --out AppIcon.iconset/icon_512x512@2x.png >/dev/null 2>&1 && \
             iconutil -c icns AppIcon.iconset -o "$APP_DIR/Resources/AppIcon.icns"; then
            ICON_PLIST="  <key>CFBundleIconFile</key><string>AppIcon</string>"
          fi
          rm -rf AppIcon.iconset
          cat > "$APP_DIR/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Sunset Launcher</string>
            <key>CFBundleDisplayName</key><string>Sunset Launcher</string>
            <key>CFBundleIdentifier</key><string>io.github.sunset-launcher</string>
            <key>CFBundleVersion</key><string>${VER}</string>
            <key>CFBundleShortVersionString</key><string>${VER}</string>
            <key>CFBundleExecutable</key><string>sunset-launcher</string>
            <key>NSHighResolutionCapable</key><true/>
          ${ICON_PLIST}
          </dict>
          </plist>
          EOF
          sed -i '' 's/^          //' "$APP_DIR/Info.plist"
          ditto -c -k --sequesterRsrc --keepParent "Sunset Launcher.app" "dist/${{ matrix.artifact_name }}.app.zip"

      - name: Package macOS .dmg installer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rm -rf dmg_root
          mkdir -p dmg_root
          ditto "Sunset Launcher.app" "dmg_root/Sunset Launcher.app"
          ln -s /Applications "dmg_root/Applications"
          hdiutil create -volname "Sunset Launcher" -srcfolder dmg_root -ov -format UDZO "dist/${{ matrix.artifact_name }}.dmg"
          rm -rf dmg_root

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/*

      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
