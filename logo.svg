<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <filter id="weld-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Soft ambient emerald outer glow -->
  <rect x="10" y="10" width="492" height="492" rx="138" fill="#1BD96A" fill-opacity="0.16" />

  <!-- Deep obsidian-emerald squircle badge + emerald rim -->
  <rect x="24" y="24" width="464" height="464" rx="121" fill="#0D1814" stroke="#1BD96A" stroke-opacity="0.82" stroke-width="12" />

  <!-- Subtle inner top specular rim -->
  <line x1="152" y1="36" x2="360" y2="36" stroke="#A0FFC8" stroke-opacity="0.43" stroke-width="6" stroke-linecap="round" />

  <!-- 3-face shaded isometric Minecraft voxel cube -->
  <polygon points="256,105.2 392.6,184.1 256,263 119.4,184.1" fill="#42F58A" />
  <polygon points="119.4,184.1 256,263 256,420.8 119.4,341.9" fill="#1BD96A" />
  <polygon points="256,263 392.6,184.1 392.6,341.9 256,420.8" fill="#0E803E" />

  <!-- Isometric seams & outline -->
  <g stroke="#08100D" stroke-opacity="0.86" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="256,105.2 392.6,184.1 392.6,341.9 256,420.8 119.4,341.9 119.4,184.1" fill="none" />
    <line x1="119.4" y1="184.1" x2="256" y2="263" />
    <line x1="392.6" y1="184.1" x2="256" y2="263" />
    <line x1="256" y1="263" x2="256" y2="420.8" />
  </g>

  <!-- Signature "Svarka" welding arc bolt -->
  <g filter="url(#weld-glow)">
    <polyline
      points="293.9,171.5 218.1,256.7 290.7,269.3 218.1,354.5"
      stroke="#8CFFCD"
      stroke-opacity="0.52"
      stroke-width="46"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
    <polyline
      points="293.9,171.5 218.1,256.7 290.7,269.3 218.1,354.5"
      stroke="#FFFCEB"
      stroke-width="22"
      stroke-linecap="round"
      stroke-linejoin="round"
      fill="none"
    />
  </g>

  <!-- Welding spark glints -->
  <circle cx="353.8" cy="165.2" r="18" fill="#FFE073" />
  <circle cx="155.0" cy="348.2" r="15.5" fill="#FFE073" />
  <circle cx="256" cy="263" r="19" fill="#FFFFFF" />
</svg>
